[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "BSD-3-Clause"
repository = "https://github.com/cbrnr/kymo"
authors = ["Clemens Brunner <clemens.brunner@gmail.com>"]

[workspace.dependencies]
kymo-core = { path = "crates/kymo-core" }
kymo-testgen = { path = "crates/kymo-testgen" }
blake3 = "1.8"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
dirs = "7"
eframe = "0.37"
jiff = { version = "0.2", default-features = false, features = ["std"] }
memmap2 = "0.9"
# macOS only, already pulled in by eframe; names the process for the app menu.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
proptest = "1"
rfd = "0.17.2"
thiserror = "2"

[workspace.lints.rust]
# `unsafe` is only allowed where unavoidable (memory mapping), opted in locally with a SAFETY comment.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
# Lists of sample ranges (segments) are a core type here; `vec![0..n]` is meant as one range.
single_range_in_vec_init = "allow"

[profile.release]
debug = "line-tables-only"
