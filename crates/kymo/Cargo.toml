[package]
name = "kymo"
description = "Viewer for large EEG/MEG recordings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The binary only dispatches the parsed command; its parts are tested in the library.
[[bin]]
name = "kymo"
path = "src/main.rs"
test = false

[dependencies]
anyhow = "1"
bytemuck.workspace = true
eframe.workspace = true
kymo-core.workspace = true
rfd.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[target.'cfg(windows)'.dependencies]
muda.workspace = true
windows-sys.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
egui_system_font_provider.workspace = true
kymo-core = { workspace = true, features = ["testing"] }
kymo-testgen.workspace = true
pollster.workspace = true
proptest.workspace = true

[lints]
workspace = true

# Peak resident memory for the frames benchmark.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[bench]]
name = "frames"
harness = false
