[package]
name = "kymo-core"
description = "Recording model, readers, min/max pyramid and tile cache for the Kymo EEG/MEG viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# In-memory reader and helpers for tests (also used by other crates' tests).
testing = []

[dependencies]
blake3.workspace = true
csv.workspace = true
dirs.workspace = true
jiff.workspace = true
memmap2.workspace = true
thiserror.workspace = true

[dev-dependencies]
anyhow = "1"
criterion.workspace = true
kymo-core = { workspace = true, features = ["testing"] }
kymo-testgen.workspace = true
proptest.workspace = true

[[bench]]
name = "build"
harness = false

[[bench]]
name = "query"
harness = false

[[bench]]
name = "decode"
harness = false

[lints]
workspace = true
