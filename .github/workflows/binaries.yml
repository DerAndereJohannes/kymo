name: Binaries

# Builds the viewer for macOS (Apple silicon), Windows and Linux (x86_64 and arm64; built on
# Ubuntu 22.04, so the binaries need glibc 2.35 or newer, which a step checks) and
# uploads one artifact per platform, the file itself, not zipped again:
#
# - macOS: `Kymo-<version>-macos-arm64.dmg`, a disk image with Kymo.app (signed with the
#   Developer ID, notarized and stapled, as is the image) and a link to /Applications;
# - Windows: `kymo-<version>-windows-x86_64.zip`, the binary and the license;
# - Linux: `kymo-<version>-linux-<x86_64|arm64>.tar.gz`, the same.
#
# The commit follows the version unless the run is for a tag (`kymo-0.1.0-abc1234-…`).
# Download them from the run's page or with `gh api repos/OWNER/REPO/actions/artifacts/ID/zip
# > NAME` (`gh run download` expects a zip and fails). Run it by hand (Actions tab, or
# `gh workflow run binaries.yml`), or call it from another workflow (the release one) with
# `uses: ./.github/workflows/binaries.yml` and `secrets: inherit`, and download the
# artifacts in a later job.
#
# Signing needs the repository's secrets MACOS_CERT_P12_BASE64 (the Developer ID Application
# certificate with its key, a .p12 in base64), MACOS_CERT_PASSWORD (its password),
# AC_USERNAME (the Apple ID) and AC_PASSWORD (an app-specific password for notarytool);
# without them the macOS job fails rather than build an unsigned app.

on:
  workflow_dispatch:
    inputs:
      retention-days:
        description: Days to keep the artifacts
        type: number
        default: 30
  workflow_call:
    inputs:
      retention-days:
        description: Days to keep the artifacts
        type: number
        default: 30
    secrets:
      MACOS_CERT_P12_BASE64:
        required: true
      MACOS_CERT_PASSWORD:
        required: true
      AC_USERNAME:
        required: true
      AC_PASSWORD:
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The oldest macOS Kymo.app runs on (its LSMinimumSystemVersion), for C code too.
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  MACOS_IDENTITY: "Developer ID Application: CLEMENS BRUNNER (9UC2D22DW3)"
  MACOS_TEAM: 9UC2D22DW3

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Xcode 26 or newer, whose actool compiles the icon (an Icon Composer document).
          - name: macos-arm64
            target: aarch64-apple-darwin
            os: macos-26
          - name: windows-x86_64
            target: x86_64-pc-windows-msvc
            os: windows-latest
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - name: linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The runner's image too: a cache from another one (24.04's, before the builds moved to
      # 22.04) left the arm64 build without eframe's and zbus's crates.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.os }}
      # Strip symbols and debug info on macOS and Linux (MSVC keeps them in a .pdb anyway)
      - run: cargo build --release --locked -p kymo --target ${{ matrix.target }}
        env:
          CARGO_PROFILE_RELEASE_STRIP: ${{ runner.os == 'Windows' && 'none' || 'symbols' }}
      # Ubuntu 22.04 and Debian 12 have glibc 2.35 or newer (RHEL 9 has 2.34); a symbol versioned
      # above it would keep the binary from starting there.
      - name: Check glibc
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          max=2.35
          newest=$(objdump -T "target/${{ matrix.target }}/release/kymo" \
            | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n1)
          echo "Newest glibc symbol version: $newest (allowed: $max)"
          if [ "$(printf '%s\n%s\n' "$newest" "$max" | sort -V | tail -n1)" != "$max" ]; then
            echo "::error::The binary needs glibc $newest, newer than $max"
            exit 1
          fi
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          exe=kymo
          if [ "$RUNNER_OS" = Windows ]; then exe=kymo.exe; fi
          binary="target/${{ matrix.target }}/release/$exe"
          # Starts the binary and checks its version.
          version=$("$binary" --version | cut -d' ' -f2)
          # Releases (runs for a tag) are named by version only, other builds by commit too.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            stem="$version-${{ matrix.name }}"
          else
            stem="$version-${GITHUB_SHA::7}-${{ matrix.name }}"
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            # Signed, notarized and put in a disk image by the steps below.
            mkdir dist
            xcodebuild -version
            packaging/macos/bundle.sh "$binary" "$version" dist
            # The bundle's binary starts.
            dist/Kymo.app/Contents/MacOS/kymo --version
            echo "file=Kymo-$stem.dmg" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          name="kymo-$stem"
          mkdir "$name"
          cp "$binary" LICENSE "$name/"
          # tar keeps the executable bit, which upload-artifact's own zip would drop.
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$name.zip" "$name"
            echo "file=$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "$name.tar.gz" "$name"
            echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      # A temporary keychain with the Developer ID certificate, as MNELAB's workflow has it.
      - name: Import the signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD AC_USERNAME AC_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::The secret $secret is missing; Kymo.app is only built signed"
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/build.keychain"
          password=$(openssl rand -hex 16)
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      # Hardened runtime, a secure timestamp, no entitlements (wgpu on Metal needs none);
      # nothing nested to sign, so no --deep.
      - name: Sign Kymo.app
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp --sign "$MACOS_IDENTITY" dist/Kymo.app
          codesign --verify --strict --verbose=2 dist/Kymo.app
          dist/Kymo.app/Contents/MacOS/kymo --version
      - name: Notarize Kymo.app and its disk image
        if: runner.os == 'macOS'
        env:
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
          DMG: ${{ steps.package.outputs.file }}
        run: |
          set -euo pipefail
          # Submits $1, waits for Apple's verdict, and prints the log if it isn't accepted.
          notarize() {
            result=$(xcrun notarytool submit "$1" --apple-id "$AC_USERNAME" \
              --password "$AC_PASSWORD" --team-id "$MACOS_TEAM" --wait --output-format json)
            echo "$result"
            status=$(echo "$result" | jq -r .status)
            if [ "$status" != Accepted ]; then
              xcrun notarytool log "$(echo "$result" | jq -r .id)" --apple-id "$AC_USERNAME" \
                --password "$AC_PASSWORD" --team-id "$MACOS_TEAM"
              echo "::error::Notarizing $1 ended with: $status"
              exit 1
            fi
          }
          # Fetching the ticket from Apple often times out, so it is tried again.
          staple() {
            for attempt in 1 2 3 4 5; do
              if perl -e 'alarm 120; exec @ARGV' xcrun stapler staple "$1"; then
                xcrun stapler validate "$1"
                return 0
              fi
              echo "Stapling $1 failed (attempt $attempt of 5)"
              sleep 30
            done
            return 1
          }
          ditto -c -k --keepParent dist/Kymo.app "$RUNNER_TEMP/Kymo.zip"
          notarize "$RUNNER_TEMP/Kymo.zip"
          staple dist/Kymo.app
          packaging/macos/dmg.sh dist/Kymo.app "$DMG"
          codesign --force --timestamp --sign "$MACOS_IDENTITY" "$DMG"
          notarize "$DMG"
          staple "$DMG"
      # What a Mac that downloaded them decides: both notarized Developer ID.
      - name: Check Gatekeeper
        if: runner.os == 'macOS'
        env:
          DMG: ${{ steps.package.outputs.file }}
        run: |
          set -euo pipefail
          spctl --assess --type execute --verbose=4 dist/Kymo.app
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
      - name: Remove the keychain
        if: runner.os == 'macOS' && always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" || true
      # Unarchived, the artifact is named after the file (`name` would be ignored).
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.file }}
          archive: false
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
