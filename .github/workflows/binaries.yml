name: Binaries

# Builds the viewer for macOS (Apple silicon), Windows and Linux (x86_64 and arm64; built on
# Ubuntu 22.04, so the binaries need glibc 2.35 or newer, which a step checks) and
# uploads one artifact per platform, the archive itself (a .tar.gz, a .zip on Windows), not
# zipped again: `kymo-<version>-<os>-<arch>.tar.gz` (`macos-arm64`, `windows-x86_64`,
# `linux-x86_64`, `linux-arm64`), with the commit after the version unless the run is for a
# tag (`kymo-0.1.0-abc1234-linux-x86_64.tar.gz`). Download them from the run's
# page or with `gh api repos/OWNER/REPO/actions/artifacts/ID/zip > NAME` (`gh run download`
# expects a zip and fails). Run it by hand (Actions tab, or
# `gh workflow run binaries.yml`), or call it from another workflow (the release one) with
# `uses: ./.github/workflows/binaries.yml` and download the artifacts in a later job.

on:
  workflow_dispatch:
    inputs:
      retention-days:
        description: Days to keep the artifacts
        type: number
        default: 30
  workflow_call:
    inputs:
      retention-days:
        description: Days to keep the artifacts
        type: number
        default: 30

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            target: aarch64-apple-darwin
            os: macos-latest
          - name: windows-x86_64
            target: x86_64-pc-windows-msvc
            os: windows-latest
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - name: linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Strip symbols and debug info on macOS and Linux (MSVC keeps them in a .pdb anyway)
      - run: cargo build --release --locked -p kymo --target ${{ matrix.target }}
        env:
          CARGO_PROFILE_RELEASE_STRIP: ${{ runner.os == 'Windows' && 'none' || 'symbols' }}
      # Ubuntu 22.04 and Debian 12 have glibc 2.35 or newer (RHEL 9 has 2.34); a symbol versioned
      # above it would keep the binary from starting there.
      - name: Check glibc
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          max=2.35
          newest=$(objdump -T "target/${{ matrix.target }}/release/kymo" \
            | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n1)
          echo "Newest glibc symbol version: $newest (allowed: $max)"
          if [ "$(printf '%s\n%s\n' "$newest" "$max" | sort -V | tail -n1)" != "$max" ]; then
            echo "::error::The binary needs glibc $newest, newer than $max"
            exit 1
          fi
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          exe=kymo
          if [ "$RUNNER_OS" = Windows ]; then exe=kymo.exe; fi
          binary="target/${{ matrix.target }}/release/$exe"
          # Starts the binary and checks its version.
          version=$("$binary" --version | cut -d' ' -f2)
          # Releases (runs for a tag) are named by version only, other builds by commit too.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            name="kymo-$version-${{ matrix.name }}"
          else
            name="kymo-$version-${GITHUB_SHA::7}-${{ matrix.name }}"
          fi
          mkdir "$name"
          cp "$binary" LICENSE "$name/"
          # tar keeps the executable bit, which upload-artifact's own zip would drop.
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$name.zip" "$name"
            echo "file=$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "$name.tar.gz" "$name"
            echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      # Unarchived, the artifact is named after the file (`name` would be ignored).
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.file }}
          archive: false
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
