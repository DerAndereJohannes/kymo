name: Binaries

# Builds the viewer for macOS (Apple silicon), Windows and Linux (x86_64 and arm64; built on
# Ubuntu 22.04, so the binaries need glibc 2.35 or newer, which a step checks) and
# uploads one artifact per platform, the file itself, not zipped again:
#
# - macOS: `Kymo-<version>-macos-arm64.dmg`, a disk image with Kymo.app (signed with the
#   Developer ID, notarized and stapled, as is the image) and a link to /Applications;
# - Windows: `Kymo-<version>-windows-x86_64-setup.exe`, an installer (Inno Setup; per user by
#   default, Start menu, Open With, PATH if chosen; unsigned);
# - Linux: `kymo-<version>-linux-<x86_64|arm64>.tar.gz`, the binary, the license, the desktop
#   entry, icons and file types (`share/`) and `install.sh`, which installs them for the user.

#
# The commit follows the version unless the run is for a tag (`kymo-0.1.0-abc1234-…`).
# Download them from the run's page or with `gh api repos/OWNER/REPO/actions/artifacts/ID/zip
# > NAME` (`gh run download` expects a zip and fails). Run it by hand (Actions tab, or
# `gh workflow run binaries.yml`), or call it from another workflow (the release one) with
# `uses: ./.github/workflows/binaries.yml` and `secrets: inherit`, and download the
# artifacts in a later job.
#
# Signing needs the repository's secrets MACOS_CERT_P12_BASE64 (the Developer ID Application
# certificate with its key, a .p12 in base64), MACOS_CERT_PASSWORD (its password),
# AC_USERNAME (the Apple ID) and AC_PASSWORD (an app-specific password for notarytool);
# without them the macOS job fails rather than build an unsigned app.

on:
  workflow_dispatch:
    inputs:
      retention-days:
        description: Days to keep the artifacts
        type: number
        default: 30
  workflow_call:
    inputs:
      retention-days:
        description: Days to keep the artifacts
        type: number
        default: 30
    secrets:
      MACOS_CERT_P12_BASE64:
        required: true
      MACOS_CERT_PASSWORD:
        required: true
      AC_USERNAME:
        required: true
      AC_PASSWORD:
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The oldest macOS Kymo.app runs on (its LSMinimumSystemVersion), for C code too.
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  MACOS_IDENTITY: "Developer ID Application: CLEMENS BRUNNER (9UC2D22DW3)"
  MACOS_TEAM: 9UC2D22DW3

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Xcode 26 or newer, whose actool compiles the icon (an Icon Composer document).
          - name: macos-arm64
            target: aarch64-apple-darwin
            os: macos-26
          - name: windows-x86_64
            target: x86_64-pc-windows-msvc
            os: windows-latest
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - name: linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The runner's image too: a cache from another one (24.04's, before the builds moved to
      # 22.04) left the arm64 build without eframe's and zbus's crates.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.os }}
      # Strip symbols and debug info on macOS and Linux (MSVC keeps them in a .pdb anyway)
      - run: cargo build --release --locked -p kymo --target ${{ matrix.target }}
        env:
          CARGO_PROFILE_RELEASE_STRIP: ${{ runner.os == 'Windows' && 'none' || 'symbols' }}
      # Ubuntu 22.04 and Debian 12 have glibc 2.35 or newer (RHEL 9 has 2.34); a symbol versioned
      # above it would keep the binary from starting there.
      - name: Check glibc
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          max=2.35
          newest=$(objdump -T "target/${{ matrix.target }}/release/kymo" \
            | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n1)
          echo "Newest glibc symbol version: $newest (allowed: $max)"
          if [ "$(printf '%s\n%s\n' "$newest" "$max" | sort -V | tail -n1)" != "$max" ]; then
            echo "::error::The binary needs glibc $newest, newer than $max"
            exit 1
          fi
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          exe=kymo
          if [ "$RUNNER_OS" = Windows ]; then exe=kymo.exe; fi
          binary="target/${{ matrix.target }}/release/$exe"
          # Starts the binary and checks its version.
          version=$("$binary" --version | cut -d' ' -f2)
          # Releases (runs for a tag) are named by version only, other builds by commit too.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            stem="$version-${{ matrix.name }}"
          else
            stem="$version-${GITHUB_SHA::7}-${{ matrix.name }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stem=$stem" >> "$GITHUB_OUTPUT"
          if [ "$RUNNER_OS" = macOS ]; then
            # Signed, notarized and put in a disk image by the steps below.
            mkdir dist
            xcodebuild -version
            packaging/macos/bundle.sh "$binary" "$version" dist
            # The bundle's binary starts.
            dist/Kymo.app/Contents/MacOS/kymo --version
            echo "file=Kymo-$stem.dmg" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Windows' asset is the installer, built and uploaded by the steps below.
          if [ "$RUNNER_OS" = Windows ]; then exit 0; fi
          name="kymo-$stem"
          mkdir "$name"
          cp "$binary" LICENSE "$name/"
          # The desktop entry, icons and file types, and the script that installs them.
          cp packaging/linux/install.sh "$name/"
          install -Dm644 packaging/linux/kymo.desktop "$name/share/applications/kymo.desktop"
          install -Dm644 packaging/linux/kymo.xml "$name/share/mime/packages/kymo.xml"
          for size in 16 24 32 48 64 128 256 512; do
            install -Dm644 "crates/kymo/assets/png/kymo-$size.png" \
              "$name/share/icons/hicolor/${size}x${size}/apps/kymo.png"
          done
          install -Dm644 crates/kymo/assets/kymo.svg \
            "$name/share/icons/hicolor/scalable/apps/kymo.svg"
          echo "dir=$name" >> "$GITHUB_OUTPUT"
          # tar keeps the executable bit, which upload-artifact's own zip would drop.
          tar czf "$name.tar.gz" "$name"
          echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"
      # The desktop entry is valid, and install.sh installs it, the icons and the file types
      # into a home of its own and removes them again.
      - name: Check the desktop files
        if: runner.os == 'Linux'
        env:
          DIR: ${{ steps.package.outputs.dir }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils shared-mime-info libxml2-utils > /dev/null
          desktop-file-validate packaging/linux/kymo.desktop
          xmllint --noout packaging/linux/kymo.xml
          export HOME=$(mktemp -d)
          "$DIR/install.sh"
          test -x "$HOME/.local/bin/kymo"
          "$HOME/.local/bin/kymo" --version
          grep -qx "Exec=$HOME/.local/bin/kymo %f" "$HOME/.local/share/applications/kymo.desktop"
          test -f "$HOME/.local/share/icons/hicolor/256x256/apps/kymo.png"
          test -f "$HOME/.local/share/icons/hicolor/scalable/apps/kymo.svg"
          # update-mime-database turned the definitions into types, each with its globs.
          for type in edf bdf brainvision-header bvrf-header eeglab fiff gdf xdf; do
            test -f "$HOME/.local/share/mime/application/x-$type.xml"
          done
          grep -q 'application/x-edf:\*\.edf' "$HOME/.local/share/mime/globs2"
          "$DIR/install.sh" --uninstall
          test ! -e "$HOME/.local/bin/kymo"
          test ! -e "$HOME/.local/share/applications/kymo.desktop"
          test ! -e "$HOME/.local/share/mime/application/x-edf.xml"
      - name: Build the installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.package.outputs.version }}
          STEM: ${{ steps.package.outputs.stem }}
          TARGET: ${{ matrix.target }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          # Version information takes numbers only (0.1.0-rc.1 gives 0.1.0).
          $numeric = $env:VERSION.Split('-')[0]
          & $iscc /Qp "/DVersion=$env:VERSION" "/DNumericVersion=$numeric" `
            "/DBinary=$PWD\target\$env:TARGET\release\kymo.exe" `
            "/DOutput=Kymo-$env:STEM-setup" "/O$PWD" packaging\windows\kymo.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "file=Kymo-$env:STEM-setup.exe" >> $env:GITHUB_OUTPUT
        id: installer
      # Installs for the current user with Kymo on PATH, as a user would, checks what it put
      # in place, uninstalls, and checks that it is gone.
      - name: Check the installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SETUP: ${{ steps.installer.outputs.file }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Fail($message) { Write-Output "::error::$message"; exit 1 }
          $app = "$env:LOCALAPPDATA\Programs\Kymo"
          $classes = 'HKCU:\Software\Classes'
          Start-Process -Wait -FilePath ".\$env:SETUP" `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/TASKS=addtopath'
          if (-not (Test-Path "$app\kymo.exe")) { Fail "no $app\kymo.exe" }
          $info = (Get-Item "$app\kymo.exe").VersionInfo
          Write-Output "kymo.exe: $($info.ProductName) $($info.FileVersion)"
          if ($info.ProductName -ne 'Kymo') { Fail 'kymo.exe has no version information' }
          foreach ($ext in 'edf', 'bdf', 'vhdr', 'bvrh', 'set', 'fif', 'gdf', 'xdf') {
            $progids = Get-ItemProperty "$classes\.$ext\OpenWithProgids" -ErrorAction SilentlyContinue
            if (-not $progids -or $null -eq $progids.'Kymo.Recording') { Fail "Open With misses .$ext" }
          }
          $command = (Get-ItemProperty "$classes\Kymo.Recording\shell\open\command").'(default)'
          Write-Output "open command: $command"
          if ($command -ne "`"$app\kymo.exe`" `"%1`"") { Fail "wrong open command: $command" }
          $path = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not ($path.Split(';') -contains $app)) { Fail "Kymo is not on PATH: $path" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Kymo.lnk")) {
            Fail 'no Start menu entry'
          }

          # The uninstaller starts a copy of itself and returns at once.
          Start-Process -Wait -FilePath "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\kymo.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\kymo.exe") { Fail 'kymo.exe is still installed' }
          if (Test-Path "$classes\Kymo.Recording") { Fail 'the file type is still registered' }
          $progids = Get-ItemProperty "$classes\.edf\OpenWithProgids" -ErrorAction SilentlyContinue
          if ($progids -and $null -ne $progids.'Kymo.Recording') { Fail 'Open With still lists Kymo' }
          $path = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($path -and ($path.Split(';') -contains $app)) { Fail "Kymo is still on PATH: $path" }
          Write-Output 'Installed, checked and uninstalled'
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          path: ${{ steps.installer.outputs.file }}
          archive: false
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
      # A temporary keychain with the Developer ID certificate, as MNELAB's workflow has it.
      - name: Import the signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD AC_USERNAME AC_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::The secret $secret is missing; Kymo.app is only built signed"
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/build.keychain"
          password=$(openssl rand -hex 16)
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      # Hardened runtime, a secure timestamp, no entitlements (wgpu on Metal needs none);
      # nothing nested to sign, so no --deep.
      - name: Sign Kymo.app
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp --sign "$MACOS_IDENTITY" dist/Kymo.app
          codesign --verify --strict --verbose=2 dist/Kymo.app
          dist/Kymo.app/Contents/MacOS/kymo --version
      - name: Notarize Kymo.app and its disk image
        if: runner.os == 'macOS'
        env:
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
          DMG: ${{ steps.package.outputs.file }}
        run: |
          set -euo pipefail
          # Submits $1, waits for Apple's verdict, and prints the log if it isn't accepted.
          notarize() {
            result=$(xcrun notarytool submit "$1" --apple-id "$AC_USERNAME" \
              --password "$AC_PASSWORD" --team-id "$MACOS_TEAM" --wait --output-format json)
            echo "$result"
            status=$(echo "$result" | jq -r .status)
            if [ "$status" != Accepted ]; then
              xcrun notarytool log "$(echo "$result" | jq -r .id)" --apple-id "$AC_USERNAME" \
                --password "$AC_PASSWORD" --team-id "$MACOS_TEAM"
              echo "::error::Notarizing $1 ended with: $status"
              exit 1
            fi
          }
          # Fetching the ticket from Apple often times out, so it is tried again.
          staple() {
            for attempt in 1 2 3 4 5; do
              if perl -e 'alarm 120; exec @ARGV' xcrun stapler staple "$1"; then
                xcrun stapler validate "$1"
                return 0
              fi
              echo "Stapling $1 failed (attempt $attempt of 5)"
              sleep 30
            done
            return 1
          }
          ditto -c -k --keepParent dist/Kymo.app "$RUNNER_TEMP/Kymo.zip"
          notarize "$RUNNER_TEMP/Kymo.zip"
          staple dist/Kymo.app
          packaging/macos/dmg.sh dist/Kymo.app "$DMG"
          codesign --force --timestamp --sign "$MACOS_IDENTITY" "$DMG"
          notarize "$DMG"
          staple "$DMG"
      # What a Mac that downloaded them decides: both notarized Developer ID.
      - name: Check Gatekeeper
        if: runner.os == 'macOS'
        env:
          DMG: ${{ steps.package.outputs.file }}
        run: |
          set -euo pipefail
          spctl --assess --type execute --verbose=4 dist/Kymo.app
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
      - name: Remove the keychain
        if: runner.os == 'macOS' && always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" || true
      # Unarchived, the artifact is named after the file (`name` would be ignored). Windows'
      # installer is uploaded above.
      - uses: actions/upload-artifact@v7
        if: runner.os != 'Windows'
        with:
          path: ${{ steps.package.outputs.file }}
          archive: false
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
