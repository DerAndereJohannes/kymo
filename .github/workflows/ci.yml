name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Mesa's software Vulkan driver (lavapipe), so the renderer's GPU tests run here
      # instead of skipping.
      - name: Install a software Vulkan driver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          echo "KYMO_REQUIRE_GPU=1" >> "$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Every crate's tests, also after one fails, so a failure can't hide another.
      - run: cargo test --workspace --no-fail-fast
